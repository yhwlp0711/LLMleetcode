[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlleetcode"
version = "0.1.0"
description = "LeetCode-style hand-coding judge for ML/LLM interviews"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "rich>=13.0",
    "pyyaml>=6.0",
    "click>=8.1",
    "pytest>=7.4",
]

[project.optional-dependencies]
web = ["fastapi>=0.100", "uvicorn[standard]>=0.23", "pydantic>=2.0"]

[project.scripts]
mlleetcode = "mlleetcode.cli:main"

[tool.setuptools.packages.find]
include = ["mlleetcode*"]
exclude = ["problems*", "workspace*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["problems", "workspace", ".venv"]
